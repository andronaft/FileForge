<!doctype html>
<!-- A captioned 1280x800 store screenshot: ?title=…&sub=…&img=<path to a 1280x760 app screenshot> -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 800px; overflow: hidden; color: #f3efe6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: radial-gradient(ellipse at top left, #2a2f3d 0%, #14171f 60%); }
  header { height: 128px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; }
  h1 { font-size: 36px; font-weight: 700; letter-spacing: -.3px; }
  p { font-size: 20px; color: #a9afbb; }
  .accent { color: #ff8c28; }
  .shot { width: 1056px; margin: 0 auto; display: block; border-radius: 10px; border: 1px solid #3a4050; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
</style>
<header><h1 id="t"></h1><p id="s"></p></header>
<img class="shot" id="img">
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("t").innerHTML = q.get("title") || "";
  document.getElementById("s").textContent = q.get("sub") || "";
  document.getElementById("img").src = q.get("img");
</script>
