name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check that manifest.json is valid JSON and every script parses
        run: |
          python3 -c "import json; json.load(open('manifest.json'))"
          for f in background.js app/*.js app/tools/*.js scripts/*.mjs; do node --check "$f"; done
      - run: python3 scripts/package.py
      - name: The checks addons.mozilla.org runs on upload
        run: npx --yes web-ext@10 lint --source-dir dist/firefox
      - run: python3 scripts/build_site.py
      - uses: actions/upload-artifact@v7
        with:
          name: fileforge-extension
          path: dist/*.zip
