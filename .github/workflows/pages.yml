name: pages

# The web version lives at https://zhukovskyi.space/tools/fileforge/app/ (scripts/build_web_app.py, published by the
# site repo's tools/sync_fileforge.py). GitHub Pages only serves pages that forward the old
# https://andronaft.github.io/FileForge/ addresses there, rebuilt on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/build_pages_redirect.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
