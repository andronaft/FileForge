name: release

# Release by pushing a tag like v0.2.1, or with "Run workflow" on the Actions tab (it tags the
# version from manifest.json itself). Builds the ZIPs, publishes a GitHub Release with them and
# submits them to the Chrome Web Store and addons.mozilla.org when their secrets are set
# (docs/PUBLISHING.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Work out the release tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in manifest.json first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - run: python3 scripts/package.py
      - run: npx --yes web-ext@10 lint --source-dir dist/firefox
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk "/^## \\[?$VERSION\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "FileForge $VERSION" > notes.md
      - uses: softprops/action-gh-release@v3
        id: github-release
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FileForge ${{ env.VERSION }}
          files: |
            dist/fileforge-chrome-${{ env.VERSION }}.zip
            dist/fileforge-firefox-${{ env.VERSION }}.zip
          body_path: notes.md

      # Each store is tried even if the other one fails; the job still fails if either did.
      - name: Publish to the Chrome Web Store
        if: ${{ !cancelled() && steps.github-release.outcome == 'success' && env.CWS_REFRESH_TOKEN != '' && env.CWS_EXTENSION_ID != '' }}
        run: node scripts/publish-cws.mjs "dist/fileforge-chrome-$VERSION.zip"
      - name: Publish to addons.mozilla.org
        if: ${{ !cancelled() && steps.github-release.outcome == 'success' && env.AMO_JWT_ISSUER != '' }}
        # --approval-timeout 0: submit for review without waiting for it
        run: >-
          npx --yes web-ext@10 sign --channel listed --source-dir dist/firefox
          --amo-metadata docs/amo-metadata.json
          --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Stores without secrets
        if: ${{ !cancelled() }}
        run: |
          [ -n "$CWS_REFRESH_TOKEN" ] || echo "::notice::Chrome Web Store skipped: CWS_* secrets are not set."
          [ -n "$CWS_EXTENSION_ID" ] || echo "::notice::Chrome Web Store skipped: the CWS_EXTENSION_ID variable is not set."
          [ -n "$AMO_JWT_ISSUER" ] || echo "::notice::addons.mozilla.org skipped: AMO_* secrets are not set."
